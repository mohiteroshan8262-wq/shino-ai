
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shino AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #070b18;
  color: white;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  text-align: center;
}

h1 {
  color: #42d9ff;
  letter-spacing: 4px;
}

#status {
  color: #42d9ff;
  margin: 15px;
  font-size: 14px;
}

.orb {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  margin: 30px auto;
  background: radial-gradient(circle, #42d9ff, #1645a5, #080b20);
  box-shadow: 0 0 35px #168dff;
  transition: 0.3s;
}

.orb.active {
  box-shadow: 0 0 65px #42d9ff;
  transform: scale(1.08);
}

button {
  border: 0;
  padding: 13px 20px;
  margin: 6px;
  border-radius: 10px;
  background: #087fc4;
  color: white;
  font-size: 15px;
}

button:active {
  transform: scale(0.96);
}

#chat {
  text-align: left;
  height: 280px;
  overflow-y: auto;
  background: #111a30;
  padding: 12px;
  border-radius: 12px;
  margin-top: 25px;
}

.message {
  padding: 10px;
  margin: 8px 0;
  border-radius: 9px;
  overflow-wrap: anywhere;
}

.user {
  background: #164c78;
  text-align: right;
}

.bot {
  background: #26304b;
}

form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #42d9ff;
  background: #111a30;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>
<div class="container">

<h1>SHINO AI</h1>
<p>Your Personal AI Assistant</p>

<div id="status">SYSTEM STANDBY</div>

<div class="orb" id="orb"></div>

<button id="startBtn">🎙 Start Listening</button>
<button id="stopBtn">⏹ Stop</button>

<div id="chat">
  <div class="message bot">
    नमस्ते! मैं Shino हूँ। Start Listening दबाकर मुझे बुलाइए।
  </div>
</div>

<form id="form">
  <input id="input" placeholder="अपना सवाल लिखें..." autocomplete="off">
  <button type="submit">Send</button>
</form>

</div>

<script>
const statusText = document.getElementById("status");
const orb = document.getElementById("orb");
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let recognition;
let listening = false;
let speaking = false;
let waitingForCommand = false;

function setStatus(message) {
  statusText.textContent = message;
}

function addMessage(message, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = message;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(message) {
  if (!("speechSynthesis" in window)) {
    addMessage("इस फोन में Speech Synthesis उपलब्ध नहीं है।", "bot");
    return;
  }

  speaking = true;

  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = "hi-IN";
  utterance.rate = 0.95;
  utterance.pitch = 1.05;

  utterance.onend = () => {
    speaking = false;
    if (listening) startRecognition();
  };

  utterance.onerror = () => {
    speaking = false;
    if (listening) startRecognition();
  };

  window.speechSynthesis.speak(utterance);
}

async function sendToAI(message) {
  addMessage(message, "user");
  setStatus("SHINO THINKING...");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error");
    }

    const reply =
      data.reply || data.response || data.message;

    if (!reply) {
      throw new Error("AI का जवाब नहीं मिला।");
    }

    addMessage(reply, "bot");
    setStatus("SHINO ONLINE");
    speak(reply);

  } catch (error) {
    addMessage("माफ़ कीजिए, अभी जवाब नहीं मिल पाया।", "bot");
    setStatus("CONNECTION ERROR");
    console.error(error);
  }
}

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

function startRecognition() {
  if (!listening || speaking || !recognition) return;

  try {
    recognition.start();
  } catch (error) {
    console.log("Recognition start:", error);
  }
}

function setupVoice() {
  if (!SpeechRecognition) {
    setStatus("VOICE NOT SUPPORTED");
    addMessage(
      "इस Chrome में Voice Recognition उपलब्ध नहीं है।",
      "bot"
    );
    listening = false;
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    setStatus(
      waitingForCommand
        ? "LISTENING FOR YOUR COMMAND..."
        : "LISTENING FOR HI SHINO..."
    );
    orb.classList.add("active");
  };

  recognition.onresult = (event) => {
    const result =
      event.results[event.results.length - 1][0]
        .transcript.trim();

    const spoken = result.toLowerCase();

    console.log("Recognized:", result);

    if (
      spoken.includes("hi shino") ||
      spoken.includes("hii shino") ||
      spoken.includes("hey shino") ||
      spoken.includes("हाय शिनो") ||
      spoken.includes("हाय शीनो") ||
      spoken.includes("हे शिनो")
    ) {
      if (!waitingForCommand) {
        waitingForCommand = true;
        addMessage(result, "user");

        speak(
          "जी, मैं सुन रही हूँ। बताइए, मैं आपकी क्या सहायता कर सकती हूँ?"
        );
      }
      return;
    }

    if (waitingForCommand && !speaking) {
      waitingForCommand = false;
      sendToAI(result);
    }
  };

  recognition.onerror = (event) => {
    console.log("Voice error:", event.error);

    if (event.error === "not-allowed") {
      setStatus("MICROPHONE PERMISSION DENIED");
      listening = false;
    } else if (event.error === "no-speech") {
      setStatus("NO SPEECH DETECTED");
    } else {
      setStatus("VOICE ERROR: " + event.error);
    }
  };

  recognition.onend = () => {
    orb.classList.remove("active");

    if (listening && !speaking) {
      setTimeout(startRecognition, 500);
    }
  };

  startRecognition();
}

document.getElementById("startBtn").onclick = () => {
  if (listening) return;

  listening = true;
  waitingForCommand = false;

  setupVoice();
};

document.getElementById("stopBtn").onclick = () => {
  listening = false;
  waitingForCommand = false;

  if (recognition) {
    try {
      recognition.stop();
    } catch (e) {}
  }

  window.speechSynthesis.cancel();

  speaking = false;
  setStatus("SYSTEM STANDBY");
  orb.classList.remove("active");
};

document.getElementById("form").onsubmit = (event) => {
  event.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  sendToAI(message);
};
</script>

</body>
</html>
